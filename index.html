<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جستجوی مواد قانونی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#14262b;--mute:#5d7076;--line:#d5dee1;--main:#0f4c5c;--hl:#ffe08a;--soft:#e4eef0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1e;--card:#162429;--ink:#e6eff1;--mute:#93a9af;--line:#284047;--main:#6cc3d5;--hl:#6b5514;--soft:#1d3238}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.search{top:env(safe-area-inset-top,0px)!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 4px;color:var(--main)}
.sub{color:var(--mute);margin:0 0 18px;font-size:.92rem}
.search{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.search input{flex:1;font:inherit;font-size:1.05rem;padding:12px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--main)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
select,button,.file{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover,.file:hover{border-color:var(--main)}
.file input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--soft);border-radius:20px;padding:2px 12px;font-size:.82rem}
.chip b{color:var(--main)}.chip .viewall{font:inherit;font-size:.78rem;padding:0 10px;margin-right:8px;border-radius:12px}
.chip i{cursor:pointer;font-style:normal;margin-right:8px;color:var(--mute)}
.count{color:var(--mute);font-size:.9rem;margin:4px 0 10px}
.res{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--main);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:4px}
.law{background:var(--main);color:var(--card);border-radius:6px;padding:0 10px;font-size:.8rem}
.num{font-weight:800;font-size:1.1rem}
.path{color:var(--mute);font-size:.82rem}
.txt{white-space:pre-wrap;margin:6px 0}
.sec{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sec h4{margin:0 0 2px;font-size:.88rem;color:var(--main)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:2px dashed var(--line);border-radius:12px}
.modes{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.9rem;margin:2px 0 8px}
.modes label{cursor:pointer}
.grp{margin:22px 0 8px;padding:8px 14px;background:var(--soft);border-radius:8px;font-weight:600}
.grp small{color:var(--mute);font-weight:400}
.topic{display:block;width:100%;text-align:right;margin-bottom:6px}
.topic small{color:var(--mute)}
.path a{cursor:pointer;text-decoration:underline dotted}
.copy{margin-right:auto;font-size:.78rem;padding:1px 10px}
.precedent-list{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.precedent-link{border:0;background:transparent;color:var(--main);padding:0;text-decoration:underline;text-decoration-style:dotted;text-align:right;font:inherit;cursor:pointer}
.precedent-link:hover{background:var(--soft)}
.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:min(760px,100%);max-height:90dvh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 12px 50px #0004}
.modal-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.modal-head h2{font-size:1.1rem;margin:0;color:var(--main)}
.modal-body{white-space:pre-wrap;line-height:2}
.modal-meta{color:var(--mute);font-size:.88rem;margin:4px 0 10px}
.decision-inline{flex-basis:100%;width:100%;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:6px 0 10px;white-space:normal}
.decision-inline-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.decision-inline h3{font-size:1rem;color:var(--main);margin:0}
.decision-inline-body{white-space:pre-wrap;line-height:2}
.decision-search-result{border:1px solid var(--line);border-right:4px solid var(--main);background:var(--card);border-radius:10px;padding:12px 16px;margin:10px 0}
.decision-search-result .decision-inline{margin-top:10px}

body:not(.admin) .adm{display:none!important}
.foot{text-align:center;color:var(--mute);font-size:.8rem;margin-top:30px}

</head>
<body>
<div class="wrap">
  <h1>جستجوی مواد قانونی</h1>
  <p class="sub">شماره ماده (مثلاً «ماده ۴») یا یک کلمه را جستجو کنید.</p>

  <div class="bar">
    <label class="file adm">افزودن فایل اکسل قوانین<input type="file" id="files" accept=".xlsx,.xls,.csv" multiple></label>
    <label class="file adm">افزودن اکسل آرای وحدت رویه<input type="file" id="decisionFiles" accept=".xlsx,.xls,.csv" multiple></label>
    <select id="lawSel"><option value="">همه قوانین</option></select>
    <button id="clear" class="adm">پاک کردن همه</button>
    <button id="save" class="adm">ذخیره داده‌ها (data.bin)</button>
  </div>
  <div class="chips adm" id="chips"></div>

  <div class="search"><input id="q" type="search" placeholder="مثلاً: ماده 4 &nbsp;یا&nbsp; وصیت &nbsp;یا&nbsp; ماده 10 اراده" autofocus></div>
  <div class="modes"><b>جستجو در:</b>
    <label><input type="radio" name="mode" value="all" checked> همه (متن و موضوع)</label>
    <label><input type="radio" name="mode" value="text"> فقط متن ماده</label>
    <label><input type="radio" name="mode" value="topic"> فقط موضوع (باب / فصل / مبحث)</label>
    <button id="all" class="adm">نمایش کل مواد</button>
  </div>
  <div class="chips" id="pathchip"></div>
  <div class="count" id="count"></div>
  <div id="out"><div class="empty">در حال بارگذاری…</div></div>
  <div class="foot">این برنامه مشاوره حقوقی نیست؛ برای اطمینان، متون را با منابع رسمی تطبیق دهید.</div>
</div>

<script>
const $=id=>document.getElementById(id);
let DB=[]; let DECISIONS=[]; // آرای وحدت رویه بارگذاری‌شده
let shown=100,mode='all',exactPath='',showAll=false;const INFO={};let TOPICS=[];

/* ---------- نرمال‌سازی ---------- */
function norm(s){
  return String(s==null?'':s)
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[يى]/g,'ی').replace(/ك/g,'ک')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[\u200c\u200f\u200e]/g,' ')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// تبدیل ارقام انگلیسی به فارسی فقط برای نمایش؛ مقادیر داخلی و کلیدهای جستجو تغییر نمی‌کنند.
function persianDigits(value){return String(value??'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);}
const disp=s=>esc(persianDigits(s));

/* ---------- نمایش بندهای مستقل در خط‌های جداگانه ---------- */
function formatLegalText(value){
  let s=String(value==null?'':value).replace(/\r\n?/g,'\n');
  // حروف رایج بندبندی در قوانین ایران: «الف -»، «ب -» و ...
  const letterLabels='الف|ب|ج|د|ه|و|ز|ح|ط|ی|ک|ل|م|ن|س|ع|ف|ص|ق|ر|ش|ت|ث|خ|ذ|ض|ظ|غ';
  // اعداد فارسی، عربی یا لاتین که به شکل «۱ -» یا «1)» آمده‌اند.
  const numberLabel='[0-9۰-۹٠-٩]{1,3}\\s*(?:[-–—ـ]|[.)])';
  const label='(?:'+letterLabels+')\\s*[-–—ـ]';
  // فقط قبل از برچسبی که پس از فاصله آمده خط جدید می‌گذاریم؛ متن و ارجاعات دست‌نخورده می‌مانند.
  const re=new RegExp('\\s+(?=(?:'+label+'|'+numberLabel+')\\s+)','g');
  return s.replace(re,(gap,offset,whole)=>{
    const before=whole.slice(0,offset+gap.length);
    const next=whole.slice(offset+gap.length);
    // «شماره 743 - سال 1394» ارجاع رأی است، نه یک بند شماره‌دار؛ آن را نشکن.
    if (/^[0-9۰-۹٠-٩]{1,3}\s*(?:[-–—ـ]|[.)])/.test(next) && /شماره\s*$/.test(before)) return gap;
    return '\n';
  }).replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------- نمایش هر رأی وحدت رویه در یک خط مستقل ---------- */
function formatPrecedents(value){
  let s=String(value==null?'':value).replace(/\r\n?/g,'\n').trim();
  // هر ارجاع «شماره ... - سال ...» یک رأی مستقل است؛ قبل از شماره‌های بعدی خط جدید می‌آید.
  s=s.replace(/\s*[,،;؛]?\s*(?=شماره\s*[0-9۰-۹٠-٩]+\s*[-–—ـ]\s*سال\s*[0-9۰-۹٠-٩]+)/g,'\n');
  return s.replace(/\n{2,}/g,'\n').trim();
}

function digits(s){return String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));}
function citationHtml(value){
  const s=formatPrecedents(value); if(!s)return '';
  const re=/شماره\s*([0-9۰-۹٠-٩]+)\s*[-–—ـ]\s*سال\s*([0-9۰-۹٠-٩]+)/gi;
  let out='',last=0,m,found=false;
  while((m=re.exec(s))){found=true;out+=disp(s.slice(last,m.index));
    const n=digits(m[1]),y=digits(m[2]),label=m[0];
    out+=`<button type="button" class="precedent-link" data-decision-number="${esc(n)}" data-decision-year="${esc(y)}">${disp(label)}</button>`;
    last=re.lastIndex;
  }
  out+=disp(s.slice(last));
  return `<div class="precedent-list">${found?out:disp(s)}</div>`;
}
function decisionKey(number,year){return digits(number).replace(/\D/g,'')+'|'+digits(year).replace(/\D/g,'');}
function toggleDecisionInline(button,number,year){
  const old=button.nextElementSibling;
  if(old&&old.classList.contains('decision-inline')){old.remove();button.setAttribute('aria-expanded','false');return;}
  // Close any other expanded decision to keep the result list compact.
  document.querySelectorAll('.decision-inline').forEach(el=>el.remove());
  document.querySelectorAll('[data-decision-number][aria-expanded="true"]').forEach(el=>el.setAttribute('aria-expanded','false'));
  const key=decisionKey(number,year);
  const d=DECISIONS.find(x=>decisionKey(x.number,x.year)===key);
  const panel=document.createElement('div');panel.className='decision-inline';
  const title=d?`رأی وحدت رویه شماره ${disp(d.number)} - سال ${disp(d.year)}`:`رأی وحدت رویه شماره ${disp(number)} - سال ${disp(year)}`;
  panel.innerHTML=`<div class="decision-inline-head"><div><h3>${title}</h3>${d?.date?`<div class="modal-meta">تاریخ: ${disp(d.date)}</div>`:''}${d?.subject?`<div class="modal-meta">موضوع: ${disp(d.subject)}</div>`:''}</div><button type="button" data-close-inline>بستن ✕</button></div>${d?`<div class="decision-inline-body">${disp(d.text||'متن کامل برای این رأی ثبت نشده است.')}</div>`:`<p>متن این رأی در فایل اکسل آرای بارگذاری‌شده پیدا نشد.</p><p class="modal-meta">فایل اکسل آرا را با ستون‌های شماره رأی، سال و متن کامل رأی بارگذاری کنید.</p>`}`;
  button.insertAdjacentElement('afterend',panel);button.setAttribute('aria-expanded','true');
}
async function readDecisionFile(file){
  await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); let added=[];
  wb.SheetNames.forEach(sn=>{
    const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(grid.length<2)return;
    let hi=0,best=0;grid.slice(0,10).forEach((r,i)=>{const n=r.filter(c=>String(c).trim()!=='').length;if(n>best){best=n;hi=i;}});
    const headers=grid[hi].map(x=>norm(x).replace(/[\s_\/]/g,''));
    const find=fn=>headers.findIndex((h,i)=>fn(h,i));
    let ni=find(h=>h.includes('شماره')&&(h.includes('رای')||h.includes('رأی')||h.includes('وحدت')||h==='شماره')); if(ni<0)ni=find(h=>h==='شماره');
    let yi=find(h=>h.includes('سال'));
    let ti=find(h=>h.includes('متن')&&(h.includes('رای')||h.includes('رأی')||h.includes('کامل')||h==='متن')); if(ti<0)ti=find(h=>h.includes('رای')||h.includes('رأی'));
    let di=find(h=>h.includes('تاریخ')); let si=find(h=>h.includes('موضوع')||h.includes('عنوان'));
    if(ni<0||yi<0||ti<0){alert('در فایل «'+file.name+'» ستون‌های شماره رأی، سال و متن کامل رأی پیدا نشد. نام ستون‌ها را بررسی کنید.');return;}
    grid.slice(hi+1).forEach(r=>{
      const number=digits(r[ni]??'').match(/\d+/)?.[0]||''; const year=digits(r[yi]??'').match(/\d{4}/)?.[0]||''; const text=String(r[ti]??'').trim();
      if(number&&year&&(text||r[si]||r[di])) added.push({number,year,date:di>=0?String(r[di]??'').trim():'',subject:si>=0?String(r[si]??'').trim():'',text});
    });
  });
  return added;
}

/* ---------- خواندن اکسل (تشخیص خودکار ستون‌ها) ---------- */
const PATH_KEYS=['باب','مبحث','فصل','بخش','کتاب','گفتار','قسمت','عنوان','موضوع'];
const nk=k=>norm(k).replace(/\s|\//g,'');
function detect(headers,body){
  const H=headers.map(nk);
  const pick=(fn)=>H.findIndex((h,i)=>h&&fn(h,i));
  const stat=i=>{const v=body.map(r=>String(r[i]??'').trim()).filter(Boolean);
    return{n:v.length,avg:v.length?v.reduce((a,x)=>a+x.length,0)/v.length:0,
      numeric:v.length?v.filter(x=>/^\D{0,6}\d{1,4}\D{0,8}$/.test(norm(x))).length/v.length:0};};
  let num=pick(h=>h.includes('شمارهماده'));
  if(num<0)num=pick(h=>h.includes('شماره'));
  if(num<0)num=pick(h=>h==='ماده'||(h.includes('ماده')&&!h.includes('متن')));
  if(num<0){let best=-1,bs=0;H.forEach((h,i)=>{const st=stat(i);if(st.numeric>.8&&st.avg<12&&st.n>bs){best=i;bs=st.n;}});num=best;}
  let text=pick((h,i)=>i!==num&&h.includes('متن'));
  if(text<0)text=pick((h,i)=>i!==num&&h.includes('ماده'));
  if(text<0){let best=-1,ba=0;H.forEach((h,i)=>{if(i===num)return;const st=stat(i);if(st.avg>ba){best=i;ba=st.avg;}});text=best;}
  const path=[],secs=[];
  H.forEach((h,i)=>{
    if(!h||i===num||i===text)return;
    if(PATH_KEYS.some(p=>h.includes(p))&&stat(i).avg<90)path.push(i);else secs.push(i);
  });
  return{num,text,path,secs};
}
function parseSheet(grid,law){
  grid=grid.filter(r=>r.some(c=>String(c).trim()!==''));
  if(grid.length<2)return{rows:[],info:null};
  // ردیف سرستون: پرترین ردیف بین ۱۰ ردیف اول
  let hi=0,bc=0;
  grid.slice(0,10).forEach((r,i)=>{const c=r.filter(x=>String(x).trim()!=='').length;if(c>bc){bc=c;hi=i;}});
  const headers=grid[hi].map((h,i)=>String(h).trim()||('ستون '+(i+1)));
  const body=grid.slice(hi+1);
  const d=detect(headers,body);
  const last={};
  const rows=body.map(r=>{
    const raw=i=>i>=0?String(r[i]??'').trim():'';const PH=/^[-–—_.\s]+$/;const g=i=>{const v=raw(i);return PH.test(v)?'':v;};
    // پر کردن خودکار سلول‌های خالیِ ادغام‌شده در ستون‌های ساختاری (باب/فصل/...)
    const path=d.path.map(i=>{const rv=raw(i);let v=g(i);if(v)last[i]=v;else if(PH.test(rv))last[i]='';else v=last[i]||'';return v;}).filter(Boolean);
    const numText=g(d.num);
    const m=norm(numText).match(/\d+/);
    const sections=d.secs.map(i=>({h:headers[i],v:g(i)})).filter(x=>x.v);
    const o={law,num:m?m[0]:'',numText,text:g(d.text),path,sections};
    o.norm=norm([o.text,path.join(' '),sections.map(x=>x.v).join(' ')].join(' '));
    o.tn=norm([o.text,sections.map(x=>x.v).join(' ')].join(' '));o.pn=norm(path.join(' '));
    return o;
  }).filter(o=>(o.text||o.sections.length)&&nk(o.numText)!==nk(headers[d.num]));
  const info=`شماره: ${headers[d.num]||'نامشخص'} | متن: ${headers[d.text]||'نامشخص'} | سایر: ${[...d.path,...d.secs].map(i=>headers[i]).join('، ')}`;
  return{rows,info};
}
async function readFile(f){
  await loadXLSX();const buf=await f.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const law=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');
  let all=[],infos=[];
  wb.SheetNames.forEach(sn=>{
    const grid=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    const name=wb.SheetNames.length>1?law+' - '+sn:law;
    const r=parseSheet(grid,name);
    all=all.concat(r.rows);if(r.info)infos.push(r.info);
  });
  INFO[law]=infos.join(' // ');
  return all;
}

/* ---------- داده رمزگذاری‌شده ---------- */
const KEY_B64='wm2ahw4tdnJRS2o+HtALsM8OF3HShMmiG5OmNQedL1w=',PASS_HASH='63f689dda085cba6d2ba1f57d33df08dce1a630e346d458190d55bb245eef8d2';
let ADMIN=false,LOADERR=false,XP;
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const cKey=()=>crypto.subtle.importKey('raw',b64(KEY_B64),'AES-GCM',false,['encrypt','decrypt']);
const pipe=async(buf,S)=>new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new S('gzip'))).arrayBuffer());
async function sha(x){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function fill(o){const sv=o.sections.map(x=>x.v).join(' ');o.norm=norm([o.text,o.path.join(' '),sv].join(' '));o.tn=norm(o.text+' '+sv);o.pn=norm(o.path.join(' '));}
function loadXLSX(){return XP||(XP=new Promise((res,rej)=>{const t=document.createElement('script');t.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';t.onload=res;t.onerror=rej;document.head.appendChild(t);}));}
async function load(){
  try{
    const r=await fetch('data.bin',{cache:'no-cache'});if(!r.ok)throw 0;
    const all=new Uint8Array(await r.arrayBuffer());
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},await cKey(),all.slice(12));
    const obj=JSON.parse(new TextDecoder().decode(await pipe(plain,DecompressionStream)));
    const rows=Array.isArray(obj)?obj:(obj.laws||[]);DECISIONS=Array.isArray(obj)?[]:(obj.decisions||[]);
    rows.forEach(fill);return rows;
  }catch(e){LOADERR=true;return[];}
}
async function save(){}
async function exportData(){
  const laws=DB.map(({law,num,numText,text,path,sections})=>({law,num,numText,text,path,sections}));
  const gz=await pipe(new TextEncoder().encode(JSON.stringify({laws,decisions:DECISIONS})),CompressionStream);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await cKey(),gz));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download='data.bin';a.click();
}

/* ---------- رابط ---------- */
function refreshMeta(){
  const laws=[...new Set(DB.map(o=>o.law))];
  const cur=$('lawSel').value;
  $('lawSel').innerHTML='<option value="">همه قوانین</option>'+laws.map(l=>`<option>${esc(l)}</option>`).join('');
  if(laws.includes(cur))$('lawSel').value=cur;
  $('chips').innerHTML=laws.map(l=>`<span class="chip" title="${esc(INFO[l.split(' - ')[0]]||'')}"><b>${esc(l)}</b> (${persianDigits(DB.filter(o=>o.law===l).length)} ماده)<button class="viewall" data-view="${esc(l)}">مشاهده کل</button><i data-law="${esc(l)}" title="حذف">✕</i></span>`).join('');
}
function parseQuery(q){
  q=norm(q);
  let num=null;
  const m=q.match(/(?:ماده\s*)?(\d+)/);
  const onlyNum=/^(ماده\s*)?\d+$/.test(q);
  if(/ماده\s*\d+/.test(q)||onlyNum){
    num=q.match(/\d+/)[0];
    q=q.replace(/ماده\s*\d+/,'').replace(/^\d+$/,'').trim();
  }
  return{num,words:q.split(' ').filter(Boolean)};
}
function hlRe(words){
  if(!words.length)return null;
  const p=words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ی/g,'[یيى]').replace(/ک/g,'[کك]'));
  return new RegExp('('+p.join('|')+')','gi');
}
function render(){
  const {num,words}=parseQuery($('q').value);
  const law=$('lawSel').value,out=$('out');
  const pk=o=>o.law+'\u0001'+o.path.join(' › ');
  const lbl=k=>k.split('\u0001').filter(Boolean).join(' › ');
  $('pathchip').innerHTML=exactPath?`<span class="chip">فقط موضوع: <b>${esc(lbl(exactPath))}</b><i data-clr="1">✕</i></span>`:'';
  $('all').textContent=showAll?'بستن نمایش کل':'نمایش کل مواد';
  if(!DB.length&&!DECISIONS.length){out.innerHTML='<div class="empty">'+(LOADERR&&!ADMIN?'بارگذاری داده‌ها ممکن نشد. صفحه را از لینک سایت باز کنید و اینترنت را بررسی کنید.':'هنوز داده‌ای نیست. فایل اکسل اضافه کنید.')+'</div>';$('count').textContent='';return;}
  const inLaw=DB.filter(o=>!law||o.law===law);
  const noQ=num===null&&!words.length;const SA=ADMIN&&showAll;
  if(noQ&&!exactPath&&!SA){
    if(mode==='topic'&&ADMIN){
      const m=new Map();inLaw.forEach(o=>{if(!o.path.length)return;const k=pk(o);m.set(k,(m.get(k)||0)+1);});
      TOPICS=[...m.keys()];
      $('count').textContent=TOPICS.length?'یک موضوع را انتخاب کنید یا بخشی از نام آن را بنویسید:':'';
      out.innerHTML=TOPICS.length?TOPICS.map((k,i)=>`<button class="topic" data-t="${i}">${disp(law?lbl(k).split(' › ').slice(1).join(' › '):lbl(k))} <small>(${persianDigits(m.get(k))} ماده)</small></button>`).join(''):'<div class="empty">در این فایل‌ها ستون باب/فصل/مبحث پیدا نشد.</div>';
    }else{
      $('count').textContent=persianDigits(inLaw.length)+' ماده بارگذاری شده است.';
      out.innerHTML='<div class="empty">شماره ماده (مثلاً ماده ۴) یا یک کلمه را برای جستجو بنویسید.</div>';
    }
    return;
  }
  const f={all:'norm',text:'tn',topic:'pn'}[mode];
  const res=inLaw.filter(o=>(!exactPath||pk(o)===exactPath)&&(num===null||o.num===num)&&words.every(w=>(o[f]||'').includes(w)));
  // رأی‌ها هم در جستجو شرکت می‌کنند: شماره، سال، موضوع و متن کامل.
  const decisionResults=DECISIONS.filter(d=>{
    const corpus=norm(['رای','رأی','وحدت رویه','شماره',d.number,'سال',d.year,d.date,d.subject,d.text].join(' '));
    if(num!==null&&!words.length)return digits(d.number).replace(/\D/g,'')===num||digits(d.year).replace(/\D/g,'')===num;
    if(num!==null&&!words.every(w=>corpus.includes(w)))return false;
    return words.every(w=>corpus.includes(w))&&(num===null||corpus.includes(num));
  });
  $('count').textContent=persianDigits(res.length+decisionResults.length)+' نتیجه ('+persianDigits(res.length)+' ماده، '+persianDigits(decisionResults.length)+' رأی)'+(!ADMIN&&(res.length>50||decisionResults.length>50)?' — ۵۰ مورد اول هر بخش نمایش داده شد؛ جستجو را دقیق‌تر کنید':'');
  if(!res.length&&!decisionResults.length){out.innerHTML='<div class="empty">نتیجه‌ای پیدا نشد. عبارت کوتاه‌تر را امتحان کنید یا نوع جستجو را عوض کنید.</div>';return;}
  const re=hlRe(words);
  const H=s=>{s=disp(s);return re?s.replace(re,'<mark>$1</mark>'):s;};
  const grouped=mode==='topic'||!!exactPath||(SA&&!!law);
  const gc={};if(grouped)res.forEach(o=>{const k=pk(o);gc[k]=(gc[k]||0)+1;});
  let prev=null;
  const part=res.slice(0,ADMIN?shown:50).map(o=>{
    const k=pk(o);let g='';
    if(grouped&&k!==prev){prev=k;g=`<div class="grp"><span class="law">${esc(o.law)}</span> ${H(o.path.join(' › ')||'بدون موضوع')} <small>(${gc[k]} ماده)</small></div>`;}
    const pathHtml=(!grouped&&o.path.length)?`<div class="path"><a data-pi="${DB.indexOf(o)}" title="نمایش همه مواد این موضوع">${H(o.path.join(' › '))}</a></div>`:'';
    return g+`<div class="res"><div class="head"><span class="law">${esc(o.law)}</span>
      <span class="num">${disp(/ماده/.test(norm(o.numText))?o.numText:'ماده '+(o.numText||'؟'))}</span>
      <button class="copy" data-i="${DB.indexOf(o)}">کپی</button></div>
      ${pathHtml}
      <div class="txt">${H(formatLegalText(o.text))}</div>
      ${o.sections.map(x=>{const precedent=/رأی|رای|آرا|وحدت\s*رویه/i.test(x.h);const value=precedent?citationHtml(x.v):H(formatLegalText(x.v));return `<div class="sec"><h4>${esc(x.h)}</h4><div class="txt">${precedent?value:value}</div></div>`;}).join('')}</div>`;
  }).join('');
  const decisionPart=decisionResults.slice(0,ADMIN?shown:50).map(d=>{
    const title=`رأی وحدت رویه شماره ${d.number} - سال ${d.year}`;
    const summary=d.subject?`<div class="path">${H(d.subject)}</div>`:'';
    const excerpt=String(d.text||'').slice(0,320);
    const snippet=excerpt?`<div class="txt">${H(excerpt)}${d.text.length>320?'…':''}</div>`:'';
    return `<div class="decision-search-result"><div class="head"><span class="law">رأی وحدت رویه</span><span class="num">${disp(title)}</span></div>${d.date?`<div class="path">تاریخ: ${disp(d.date)}</div>`:''}${summary}${snippet}<button type="button" class="precedent-link" data-decision-number="${esc(d.number)}" data-decision-year="${esc(d.year)}" aria-expanded="false">نمایش متن کامل رأی</button></div>`;
  }).join('');
  out.innerHTML=part+(ADMIN&&res.length>shown?`<button id="more">نمایش بیشتر مواد</button>`:'')+decisionPart+(ADMIN&&decisionResults.length>shown?`<button id="more-decisions">نمایش آرای بیشتر</button>`:'');
}

/* ---------- رویدادها ---------- */
document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change',e=>{mode=e.target.value;shown=100;render();}));
$('all').addEventListener('click',()=>{showAll=!showAll;shown=$('lawSel').value?1e9:100;render();});
$('pathchip').addEventListener('click',e=>{if(e.target.dataset.clr){exactPath='';shown=100;render();}});
$('q').addEventListener('input',()=>{shown=100;render();});
$('lawSel').addEventListener('change',()=>{shown=(showAll&&$('lawSel').value)?1e9:100;render();});
$('files').addEventListener('change',async e=>{
  const list=[...e.target.files];
  for(const f of list){
    try{
      const rows=await readFile(f);
      const law=rows[0]?.law.split(' - ')[0]||f.name;
      DB=DB.filter(o=>o.law.split(' - ')[0]!==law).concat(rows);
    }catch(err){alert('خواندن فایل «'+f.name+'» ممکن نشد.');}
  }
  e.target.value='';
  await save();refreshMeta();render();
});
$('decisionFiles').addEventListener('change',async e=>{
  const list=[...e.target.files]; let all=[];
  for(const f of list){try{all=all.concat(await readDecisionFile(f));}catch(err){alert('خواندن فایل آرای «'+f.name+'» ممکن نشد: '+err.message);}}
  if(all.length){const map=new Map(DECISIONS.map(d=>[decisionKey(d.number,d.year),d]));all.forEach(d=>map.set(decisionKey(d.number,d.year),d));DECISIONS=[...map.values()];alert(all.length+' ردیف رأی از اکسل خوانده شد.');}
  e.target.value='';
});
$('out').addEventListener('click',e=>{
  const c=e.target.closest('[data-decision-number]');
  if(c){toggleDecisionInline(c,c.dataset.decisionNumber,c.dataset.decisionYear);return;}
});
$('out').addEventListener('click',e=>{const close=e.target.closest('[data-close-inline]');if(close){const panel=close.closest('.decision-inline');const prev=panel?.previousElementSibling;if(prev?.matches('[data-decision-number]'))prev.setAttribute('aria-expanded','false');panel?.remove();return;}if(e.target.id==='more-decisions'){shown+=100;render();return;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.decision-inline').forEach(el=>el.remove());});
$('clear').addEventListener('click',async()=>{
  if(!DB.length||!confirm('همه فایل‌های بارگذاری‌شده حذف شود؟'))return;
  DB=[];await save();refreshMeta();render();
});
$('chips').addEventListener('click',async e=>{
  const v=e.target.dataset.view;
  if(v){$('lawSel').value=v;$('q').value='';exactPath='';showAll=true;shown=1e9;render();window.scrollTo(0,0);return;}
  const l=e.target.dataset.law;if(!l)return;
  DB=DB.filter(o=>o.law!==l);await save();refreshMeta();render();
});
$('out').addEventListener('click',e=>{
  if(e.target.id==='more'){shown+=100;render();return;}
  const t=e.target.closest('[data-t],[data-pi]');
  if(t){const o=t.dataset.pi!==undefined?DB[t.dataset.pi]:null;
    exactPath=o?o.law+'\u0001'+o.path.join(' › '):TOPICS[t.dataset.t];
    shown=100;$('q').value='';render();window.scrollTo(0,0);return;}
  if(e.target.classList.contains('copy')){
    const o=DB[e.target.dataset.i];
    const t=[o.law+' - '+o.numText,o.text,...o.sections.map(x=>x.h+': '+x.v)].filter(Boolean).join('\n');
    navigator.clipboard?.writeText(t);e.target.textContent='کپی شد';
    setTimeout(()=>e.target.textContent='کپی',1200);
  }
});
(async()=>{
  DB=await load();
  if(location.hash==='#admin'){
    const p=prompt('رمز مدیر:');
    if(p&&await sha(p)===PASS_HASH){ADMIN=true;document.body.classList.add('admin');}
  }
  $('save').addEventListener('click',exportData);
  refreshMeta();render();
})();
</script>
